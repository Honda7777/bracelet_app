<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Weight</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'navbar.html' %}
    <div class="profile-container">
        <h1>Change Weight</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" placeholder="Enter your weight" min="1" max="700" required>
            </div>
            <button type="submit" class="btn">Update Weight</button>
            <a href="/profile" class="btn btn-secondary">Back to Profile Settings</a>
        </form>
    </div>
    {% include 'footer.html' %}
</body>
</html>
