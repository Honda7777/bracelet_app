<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Height</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'navbar.html' %}
    <div class="profile-container">
        <h1>Change Height</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" name="height" placeholder="Enter your height" min="30" max="300" required>
            </div>
            <button type="submit" class="btn">Update Height</button>
            <a href="/profile" class="btn btn-secondary">Back to Profile Settings</a>
        </form>
    </div>
    {% include 'footer.html' %}
</body>
</html>
