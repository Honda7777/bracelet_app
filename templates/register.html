<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include 'navbar.html' %}
    <div class="profile-container">
  <h1>Create Account</h1>
        
  {% if error %}
            <div class="error">{{ error }}</div>
  {% endif %}
        
  <form method="POST">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="Enter your age" min="1" max="120">
            </div>
            
            <div class="form-group">
                <label for="weight">Weight (kg):</label>
                <input type="number" id="weight" name="weight" placeholder="Enter your weight" min="1" max="700">
            </div>
            
            <div class="form-group">
                <label for="height">Height (cm):</label>
                <input type="number" id="height" name="height" placeholder="Enter your height" min="30" max="300">
            </div>
            
            <button type="submit" class="btn">Register</button>
            <a href="/login" class="btn btn-secondary">Login</a>
  </form>
        
        <p style="margin-top: 20px;">Already have an account? <a href="/login" style="color:#4CAF50;">Login here</a></p>
    </div>
    {% include 'footer.html' %}
</body>
</html>
